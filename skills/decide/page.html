<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisão</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<style>
  :root {
    --ink: #1c2430; --muted: #5b6573; --line: #dde3e8; --paper: #ffffff; --page: #f4f6f8;
    --accent: #0b6e6e; --accent-soft: #e6f2f2; --danger: #a33a3a;
    --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e4e8ec; --muted: #9aa5b1; --line: #2c343e; --paper: #161b21; --page: #0f1317;
      --accent: #46b3ad; --accent-soft: #15302f; --danger: #e07a7a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.6 var(--serif); }
  main { max-width: 820px; margin: 0 auto; padding: 48px 20px 140px; }
  h1, h2, h3, .kicker, .option-label, button, .badge, .progress, label.field { font-family: var(--sans); }
  .kicker { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 14px; }
  .context { color: var(--muted); }
  .question { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 26px 28px; margin-top: 28px; }
  .question h2 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; display: flex; gap: 12px; }
  .question h2 .n { color: var(--accent); }
  .options { display: grid; gap: 10px; margin: 18px 0; }
  .option { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 14px 46px; cursor: pointer; transition: border-color .15s, background .15s; }
  .option:hover { border-color: var(--accent); }
  .option input { position: absolute; left: 16px; top: 18px; accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }
  .option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .option-label { font-weight: 600; font-size: 17px; }
  .badge { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); vertical-align: 2px; }
  .summary { color: var(--muted); margin-top: 2px; }
  details { margin-top: 8px; }
  details summary { font-family: var(--sans); font-size: 14px; color: var(--accent); cursor: pointer; width: fit-content; }
  details[open] summary { margin-bottom: 6px; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin: 6px 0 6px; }
  textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .closing { margin-top: 36px; }
  .closing h2 { font-size: 19px; }
  footer { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--line); }
  footer div { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .progress { color: var(--muted); font-size: 15px; }
  .error { color: var(--danger); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .done { text-align: center; padding-top: 30vh; }
  p { margin: .5em 0; }
  code { font: 14px var(--mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--accent-soft); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; margin: 10px 0; font: 15px/1.4 var(--sans); }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 12px 6px 0; text-align: left; }
  blockquote { margin: .6em 0; padding-left: 14px; border-left: 3px solid var(--accent); color: var(--muted); }
  a { color: var(--accent); }
  img { max-width: 100%; height: auto; display: block; margin: 10px 0; border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<main id="app"></main>
<footer><div><span class="progress" id="progress"></span><button id="submit" disabled>Enviar respostas</button></div></footer>
<script type="application/json" id="round">/*ROUND*/</script>
<script>
const round = JSON.parse(document.getElementById("round").textContent);
const draftKey = `decide:${round.id}`;
const app = document.getElementById("app");

const escape = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function markdown(src = "") {
  const stash = [];
  const keep = html => `\u0000${stash.push(html) - 1}\u0000`;
  src = src
    .replace(/```\w*\n([\s\S]*?)```/g, (_, code) => keep(`<pre><code>${escape(code)}</code></pre>`))
    .replace(/`([^`\n]+)`/g, (_, code) => keep(`<code>${escape(code)}</code>`))
    .replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, math => keep(escape(math)));
  const inline = s => escape(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/!\[([^\]]*)\]\(([^)\s:]+)\)/g, '<img src="/files/$2" alt="$1">')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  const list = (lines, tag, marker) =>
    `<${tag}>${lines.join("\n").split(marker).filter(Boolean).map(item => `<li>${inline(item.trim())}</li>`).join("")}</${tag}>`;
  const table = lines => {
    const rows = lines.filter((_, i) => i !== 1).map(l => l.trim().replace(/^\||\|$/g, "").split("|"));
    const cells = (row, tag) => row.map(c => `<${tag}>${inline(c.trim())}</${tag}>`).join("");
    return `<table><tr>${cells(rows[0], "th")}</tr>${rows.slice(1).map(r => `<tr>${cells(r, "td")}</tr>`).join("")}</table>`;
  };
  const block = text => {
    const lines = text.split("\n");
    const heading = text.match(/^(#{1,4})\s+(.*)$/);
    if (heading) return `<h${heading[1].length + 2}>${inline(heading[2])}</h${heading[1].length + 2}>`;
    if (/^[-*]\s/.test(text)) return list(lines, "ul", /(?:^|\n)[-*]\s/);
    if (/^\d+\.\s/.test(text)) return list(lines, "ol", /(?:^|\n)\d+\.\s/);
    if (/^\|/.test(text) && lines.length > 2) return table(lines);
    if (/^>\s?/.test(text)) return `<blockquote>${inline(text.replace(/^>\s?/gm, ""))}</blockquote>`;
    return /^\u0000\d+\u0000$/.test(text) ? text : `<p>${inline(text)}</p>`;
  };
  return src.trim().split(/\n\s*\n/).map(block).join("")
    .replace(/\u0000(\d+)\u0000/g, (_, i) => stash[i]);
}

function render() {
  const questions = round.questions.map((q, qi) => {
    const type = q.multiple ? "checkbox" : "radio";
    const options = q.options.map(o => `
      <label class="option">
        <input type="${type}" name="${q.id}" value="${o.id}">
        <div class="option-label">${escape(o.label)}${o.recommended ? '<span class="badge">Recomendado</span>' : ""}</div>
        ${o.summary ? `<div class="summary">${markdown(o.summary)}</div>` : ""}
        ${o.details ? `<details><summary>Detalhes</summary>${markdown(o.details)}</details>` : ""}
      </label>`).join("");
    return `
      <section class="question" data-id="${q.id}">
        <h2><span class="n">${qi + 1}</span><span>${escape(q.title)}</span></h2>
        ${markdown(q.explanation)}
        <div class="options">${options}</div>
        <label class="field" for="notes-${q.id}">Notas, outra opção, ou o que não ficou claro (opcional)</label>
        <textarea id="notes-${q.id}" data-notes="${q.id}"></textarea>
      </section>`;
  }).join("");
  app.innerHTML = `
    <div class="kicker">Rodada ${escape(String(round.id))}</div>
    <h1>${escape(round.title)}</h1>
    <div class="context">${markdown(round.context)}</div>
    ${questions}
    <section class="closing">
      <h2>Comentários gerais</h2>
      <textarea id="comments" placeholder="Qualquer outra coisa, ou como prefere que eu explique da próxima vez (opcional)"></textarea>
    </section>`;
}

function collect() {
  const questions = {};
  for (const q of round.questions) {
    questions[q.id] = {
      selected: [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => i.value),
      notes: document.querySelector(`[data-notes="${q.id}"]`).value,
    };
  }
  return { questions, comments: document.getElementById("comments").value };
}

const isAnswered = a => a.selected.length > 0 || a.notes.trim() !== "";

function refresh() {
  const answers = collect();
  const done = Object.values(answers.questions).filter(isAnswered).length;
  const total = round.questions.length;
  document.getElementById("progress").textContent = `${done} de ${total} respondidas`;
  document.getElementById("submit").disabled = done < total;
  try { localStorage.setItem(draftKey, JSON.stringify(answers)); } catch {}
}

function restore() {
  let draft;
  try { draft = JSON.parse(localStorage.getItem(draftKey)); } catch {}
  if (!draft) return;
  for (const [id, a] of Object.entries(draft.questions ?? {})) {
    for (const value of a.selected ?? []) {
      const input = document.querySelector(`input[name="${id}"][value="${value}"]`);
      if (input) input.checked = true;
    }
    const notes = document.querySelector(`[data-notes="${id}"]`);
    if (notes) notes.value = a.notes ?? "";
  }
  document.getElementById("comments").value = draft.comments ?? "";
}

async function submit() {
  const button = document.getElementById("submit");
  button.disabled = true;
  try {
    const response = await fetch("/", { method: "POST", body: JSON.stringify(collect()) });
    if (!response.ok) throw new Error((await response.json()).error);
    try { localStorage.removeItem(draftKey); } catch {}
    document.querySelector("footer").remove();
    app.innerHTML = `<div class="done"><div class="kicker">Enviado</div><h1>Pode fechar esta aba.</h1><p class="context">O Claude já está lendo suas respostas.</p></div>`;
    setTimeout(() => window.close(), 600);
  } catch (error) {
    const progress = document.getElementById("progress");
    progress.textContent = `Não foi possível enviar (${error.message}). O rascunho está salvo; peça ao Claude para reabrir.`;
    progress.classList.add("error");
    button.disabled = false;
  }
}

render();
restore();
refresh();
app.addEventListener("input", refresh);
document.getElementById("submit").addEventListener("click", submit);
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !document.getElementById("submit").disabled) submit();
});
window.addEventListener("load", () => window.renderMathInElement?.(app, {
  delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
  throwOnError: false,
}));
</script>
</body>
</html>
